name: Release local install package
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Release tag, matching manifest version (for example v0.1.0)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.23.0
      - run: python scripts/validate.py
      - run: go test ./...
        working-directory: backend
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: python -c "import json,os; assert os.environ['RELEASE_TAG']=='v'+json.load(open('manifest.json'))['version']"
  package:
    needs: validate
    uses: t8y2/dbx/.github/workflows/plugin-release-reusable.yml@plugin-cli-v0.1.10
    with:
      release-tag: ${{ github.event.release.tag_name || inputs.release_tag }}
      package-command: node scripts/package.mjs
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: '0.1.10'
      go-version: '1.22.x'
      rust-toolchain: ''
      build-matrix: '{"include":[{"runner":"windows-2022","target":"windows-x64"}]}'
  metadata:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - name: Publish per-target metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern release-candidates.json --dir release-assets
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('release-assets')
          data=json.loads((root/'release-candidates.json').read_text())
          for artifact in data['artifacts']:
              name=artifact['url'].rsplit('/',1)[-1].removesuffix('.dbxp')+'.artifact.json'
              (root/name).write_text(json.dumps(artifact,indent=2)+'\n')
          PY
          gh release upload "$RELEASE_TAG" release-assets/*.artifact.json
