<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DolphinScheduler</title><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div class="brand"><svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="7" fill="#176da8"/><path d="M8 10h7m-7 6h16M8 22h7m5-12h4m-4 12h4" stroke="white" stroke-width="2" stroke-linecap="round"/></svg><div><strong>DolphinScheduler</strong><span id="connection-name">工作流运维工作台</span></div></div><span id="mode" class="badge">等待连接</span></header>
<div class="shell"><nav aria-label="功能导航"><button data-view="projects" class="active">项目</button><button data-view="workflows">工作流定义</button><button data-view="instances">运行实例</button><button data-view="schedules">定时调度</button><button data-view="logs">任务日志</button><button data-view="tools">全部工具</button><div class="nav-note">v0.1.1 · 本地开发版<br>连接信息由 DBX 管理</div></nav>
<main><div id="notice" role="status" aria-live="polite"></div><section id="welcome" hidden><h1>先创建一个连接</h1><p>在 DBX 中新建「DolphinScheduler 连接」，填写你自己的 API 主机、端口、根路径和 Token，然后测试并打开连接。</p><p>Token 只在 DBX 连接表单中填写。工作台不会读取或展示密钥。</p></section>
<div id="workspace" hidden><div class="heading"><div><h1 id="title">项目</h1><p id="subtitle">查看当前账号有权访问的项目。</p></div><button id="refresh">刷新</button></div>
<section class="project-bar"><label for="project">当前项目</label><select id="project"><option value="">选择项目</option></select><label for="project-code">项目 Code</label><input id="project-code" inputmode="numeric" placeholder="也可直接输入完整 Code" autocomplete="off"></section>
<div id="browser"><form id="filter" class="toolbar"><label for="search">搜索名称</label><input id="search" placeholder="输入名称筛选"><button type="button" id="filter-run">查询</button><button id="create" type="button" hidden>新建</button></form><div id="table-wrap" class="table-wrap"></div><div class="pager"><span id="count"></span><div><button id="prev">上一页</button><span id="page">第 1 页</span><button id="next">下一页</button></div></div></div>
<section id="toolbox" hidden><label for="tool-select">选择操作</label><select id="tool-select"></select><div id="tool-fields"></div><button id="tool-run" class="primary">执行操作</button><p class="hint">64 位 Code 使用完整十进制字符串。JSON 参数填写合法 JSON 文本。</p></section>
<section id="result-section" hidden><div class="result-heading"><h2>结果详情</h2><button id="close-result">收起</button></div><pre id="result" tabindex="0"></pre></section></div></main></div>
<dialog id="action-dialog"><form id="action-form"><div class="dialog-heading"><h2 id="action-title"></h2><button type="button" id="cancel-action">关闭</button></div><p id="action-desc" class="hint"></p><div id="action-fields"></div><div class="dialog-footer"><span id="action-error" role="alert"></span><button type="button" class="primary" id="action-submit">执行操作</button></div></form></dialog>
<script src="app.js"></script></body></html>
